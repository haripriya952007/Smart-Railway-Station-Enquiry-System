<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Railway Stations</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .station-container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .station-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
            border-top: 5px solid #123c69;
            transition: 0.3s;
            text-align: center;
        }

        .station-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 10px 25px rgba(18, 60, 105, 0.2);
        }

        .station-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .station-code {
            display: inline-block;
            background: #dceeff;
            color: #123c69;
            padding: 7px 18px;
            border-radius: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .station-card h3 {
            color: #123c69;
            margin: 10px 0;
        }

        .station-card p {
            color: #555;
            margin: 8px 0;
        }

        .station-details {
            background: #f2f7fc;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            text-align: left;
        }

        .station-details p {
            margin: 8px 0;
            font-size: 14px;
        }

        .station-button {
            background: #123c69;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 7px;
            margin-top: 15px;
            cursor: pointer;
        }

        .station-button:hover {
            background: #1d5b91;
        }

        .back-home {
            background: #123c69;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .back-home:hover {
            background: #1d5b91;
        }
    </style>
</head>

<body>

    <header>
        <h1>🚉 Railway Stations</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="stations.html">Stations</a>
        </nav>
    </header>

    <section class="section">

        <h2>🚉 Explore Railway Stations</h2>

        <p>Find station codes, locations and available facilities.</p>

        <div id="stationResult">
            <p>Loading stations...</p>
        </div>

    </section>

    <!-- Back to Home Button -->
    <div style="text-align:center; margin:25px;">
        <button class="back-home"
            onclick="window.location.href='../index.html'">
            ⬅ Back to Home
        </button>
    </div>

    <footer>
        <p>© 2026 Smart Railway Station Enquiry System</p>
    </footer>

    <script>
        async function loadStations() {

            const result = document.getElementById("stationResult");

            try {
                const response = await fetch("http://localhost:5000/api/stations");

                if (!response.ok) {
                    throw new Error("Unable to load stations");
                }

                const stations = await response.json();

                if (!Array.isArray(stations) || stations.length === 0) {
                    result.innerHTML = "<h3>No Stations Available</h3>";
                    return;
                }

                let cards = "";

                stations.forEach(function(station) {

                    cards += `
                        <div class="station-card">

                            <div class="station-icon">🚉</div>

                            <span class="station-code">
                                ${station.station_code ?? ""}
                            </span>

                            <h3>${station.station_name ?? ""}</h3>

                            <p>📍 ${station.city ?? ""}, Tamil Nadu</p>

                            <div class="station-details">
                                <p>🚆 Railway Station</p>
                                <p>🛋️ Waiting Room</p>
                                <p>💧 Drinking Water</p>
                                <p>🚗 Parking</p>
                            </div>

                            <button class="station-button"
                                onclick="showStation('${station.station_name ?? ""}', '${station.station_code ?? ""}', '${station.city ?? ""}')">
                                View Details
                            </button>

                        </div>
                    `;
                });

                result.innerHTML = `
                    <div class="station-container">
                        ${cards}
                    </div>
                `;

            } catch (error) {

                console.error("Station error:", error);

                result.innerHTML = `
                    <div class="not-found">
                        <h3>❌ Unable to Load Stations</h3>
                        <p>Please check the backend server.</p>
                    </div>
                `;
            }
        }

        function showStation(name, code, city) {
            alert(
                "🚉 Station Details\n\n" +
                "Station Name: " + name + "\n" +
                "Station Code: " + code + "\n" +
                "City: " + city
            );
        }

        loadStations();
    </script>

</body>
</html>
